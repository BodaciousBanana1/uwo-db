{#- Embed data/links/<section>.json for client-side linking (static/js/links.js).
    Set `link_secs` (comma-separated sections) before including. -#}
<script>
window.UWO_BASE_URL = {{ config.base_url | json_encode() | safe }};
window.UWO_LINK_INDEX = {
{%- for sec in link_secs | split(pat=",") %}
{%- set idx = load_data(path="data/links/" ~ sec ~ ".json", required=false) %}
{{ sec | json_encode() | safe }}: {% if idx %}{{ idx | json_encode() | safe }}{% else %}{}{% endif %}{% if not loop.last %},{% endif %}
{%- endfor %}
};
</script>
<script src="{{ get_url(path='js/links.js') }}"></script>
